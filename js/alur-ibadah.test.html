<!doctype html>
<meta charset="utf-8">
<title>Test Alur Layar Ibadah</title>
<pre id="out"></pre>
<script type="module">
let alur = {};
try {
  alur = await import("./alur-ibadah.js");
} catch {
  // Tes tetap menunjukkan perilaku yang belum disediakan module alur.
}

const out = [];
let pass = 0, fail = 0;
function eq(name, got, want) {
  const g = JSON.stringify(got), w = JSON.stringify(want);
  if (g === w) { pass++; out.push(`PASS ${name}`); }
  else { fail++; out.push(`FAIL ${name}\n  got:  ${g}\n  want: ${w}`); }
}

const jadwal = { subuh: "04:34", dzuhur: "11:52", ashar: "15:09", maghrib: "17:56", isya: "19:01" };
const iqomah = { subuh: { menit: 10, aktif: true }, dzuhur: { menit: 10, aktif: true }, ashar: { menit: 10, aktif: true }, maghrib: { menit: 5, aktif: true }, isya: { menit: 10, aktif: true } };
const hening = { subuh: { menit: 10, aktif: true }, dzuhur: { menit: 10, aktif: true }, ashar: { menit: 10, aktif: true }, maghrib: { menit: 10, aktif: true }, isya: { menit: 10, aktif: true } };

const biasa = alur.tentukanAlur?.({
  now: new Date(2026, 8, 3, 11, 55), jadwal, iqomah, hening,
  adzanMenit: 5, jumat: { durasiMenit: 20, sholatModeAktif: true }, tarawih: null,
});
eq("hari biasa saat adzan memutuskan layar iqomah", biasa && biasa.view, "iqomah");
eq("hari biasa menyimpan fase adzan", biasa && biasa.state && biasa.state.fase, "adzan");
eq("hari biasa membawa tenggat iqomah", biasa && biasa.state && biasa.state.iqomahEndTime, "2026-09-03T05:07:00.000Z");

// Layar dan nada Adzan harus sudah dimulai 10 detik sebelum jadwal, tanpa
// memajukan akhir Adzan maupun awal Iqomah yang sudah dikonfigurasi.
const sebelumAdzan = alur.tentukanAlur?.({
  now: new Date(2026, 8, 3, 11, 51, 50), jadwal, iqomah, hening,
  adzanMenit: 5, jumat: { durasiMenit: 20, sholatModeAktif: true }, tarawih: null,
});
eq("10 detik sebelum jadwal memutuskan layar adzan", sebelumAdzan && sebelumAdzan.view, "iqomah");
eq("10 detik sebelum jadwal tetap fase adzan", sebelumAdzan && sebelumAdzan.state && sebelumAdzan.state.fase, "adzan");
eq("adzan awal menyimpan waktu mulai hitung mundur", sebelumAdzan && sebelumAdzan.state && sebelumAdzan.state.adzanStartTime, "2026-09-03T04:52:00.000Z");
eq("adzan awal tidak memajukan tenggat iqomah", sebelumAdzan && sebelumAdzan.state && sebelumAdzan.state.iqomahEndTime, "2026-09-03T05:07:00.000Z");

const heningBiasa = alur.tentukanAlur?.({
  now: new Date(2026, 8, 3, 12, 10), jadwal, iqomah, hening,
  adzanMenit: 5, jumat: { durasiMenit: 20, sholatModeAktif: true }, tarawih: null,
});
eq("hari biasa setelah iqomah memutuskan layar hening", heningBiasa && heningBiasa.view, "hening");

const jumatTanpaSlide = (jam, sholatModeAktif = true) => alur.tentukanAlur?.({
  now: new Date(`2026-09-04T${jam}:00.000Z`), jadwal, iqomah, hening,
  adzanMenit: 5, jumat: { durasiMenit: 20, sholatModeAktif }, tarawih: null,
});
eq("slide kosong tetap menampilkan adzan Jumat", jumatTanpaSlide("04:52")?.state?.key, "jumat");
eq("slide kosong masuk layar khutbah setelah adzan", jumatTanpaSlide("04:57")?.view, "jumat");
eq("slide kosong masuk Sholat Mode setelah khutbah", jumatTanpaSlide("05:17")?.view, "hening");
eq("slide kosong selesai setelah Sholat Mode", jumatTanpaSlide("05:27"), null);
eq("Sholat Mode nonaktif selesai setelah khutbah", jumatTanpaSlide("05:17", false), null);

const jumatSlide = alur.tentukanAlur?.({
  now: new Date(2026, 8, 4, 12, 0), jadwal, iqomah, hening,
  adzanMenit: 5, jumat: { durasiMenit: 20, sholatModeAktif: true }, tarawih: null,
});
eq("Jumat setelah adzan memutuskan layar slide", jumatSlide && jumatSlide.view, "jumat");
eq("slide Jumat tidak memutar nada Sholat Mode", jumatSlide && jumatSlide.state && jumatSlide.state.putarNada, false);

const jumatSebelumAdzan = alur.tentukanAlur?.({
  now: new Date(2026, 8, 4, 11, 51, 50), jadwal, iqomah, hening,
  adzanMenit: 5, jumat: { durasiMenit: 20, sholatModeAktif: true }, tarawih: null,
});
eq("Jumat 10 detik sebelum jadwal memutuskan layar adzan", jumatSebelumAdzan && jumatSebelumAdzan.view, "iqomah");
eq("Jumat 10 detik sebelum jadwal tetap fase adzan", jumatSebelumAdzan && jumatSebelumAdzan.state && jumatSebelumAdzan.state.fase, "adzan");

// Waktu absolut ini adalah Jumat 11:52 WIB; di Los Angeles masih Kamis.
const jumatZonaPerangkatBerbeda = alur.tentukanAlur?.({
  now: new Date("2026-09-04T04:52:00.000Z"), jadwal, iqomah, hening,
  adzanMenit: 5, jumat: { durasiMenit: 20, sholatModeAktif: true }, tarawih: null,
});
eq("Jumat berdasarkan WIB tetap masuk alur adzan khusus", jumatZonaPerangkatBerbeda && jumatZonaPerangkatBerbeda.view, "iqomah");
eq("Jumat berdasarkan WIB tidak menjalankan iqomah Dzuhur biasa", jumatZonaPerangkatBerbeda && jumatZonaPerangkatBerbeda.state && jumatZonaPerangkatBerbeda.state.key, "jumat");

const jumatHening = alur.tentukanAlur?.({
  now: new Date(2026, 8, 4, 12, 20), jadwal, iqomah, hening,
  adzanMenit: 5, jumat: { durasiMenit: 20, sholatModeAktif: true }, tarawih: null,
});
eq("Jumat setelah slide memutuskan layar hening", jumatHening && jumatHening.view, "hening");
eq("hening Jumat tetap tanpa nada kedua", jumatHening && jumatHening.state && jumatHening.state.putarNada, false);

out.unshift(`${pass} PASS, ${fail} FAIL\n`);
document.getElementById("out").textContent = out.join("\n");
</script>

<!doctype html>
<meta charset="utf-8">
<title>Test app.js</title>
<pre id="out"></pre>
<script type="module">
import { parseHM, nextSholat, iqomahState, heningState, harusResumeIqomah } from "./app.js";

const out = [];
let pass = 0, fail = 0;
function eq(name, got, want) {
  const g = JSON.stringify(got), w = JSON.stringify(want);
  if (g === w) { pass++; out.push(`PASS ${name}`); }
  else { fail++; out.push(`FAIL ${name}\n  got:  ${g}\n  want: ${w}`); }
}

const jadwal = { subuh:"04:34", dzuhur:"11:52", ashar:"15:09", maghrib:"17:56", isya:"19:01" };
const iq = { subuh:{menit:10,aktif:true}, dzuhur:{menit:10,aktif:true}, ashar:{menit:10,aktif:true}, maghrib:{menit:5,aktif:true}, isya:{menit:10,aktif:true} };

// parseHM: gunakan Kamis 2026-09-03 (bukan Jumat) untuk uji dzuhur
const kamis = new Date(2026, 8, 3, 0, 0, 0);
eq("parseHM jam", parseHM("11:52", kamis).getHours(), 11);
eq("parseHM menit", parseHM("11:52", kamis).getMinutes(), 52);

// nextSholat: jam 10:00 Kamis -> berikutnya Dzuhur
const t1 = new Date(2026, 8, 3, 10, 0, 0);
eq("next pagi", nextSholat(t1, jadwal).key, "dzuhur");
// jam 20:00 -> semua lewat -> Subuh besok
const t2 = new Date(2026, 8, 3, 20, 0, 0);
eq("next malam key", nextSholat(t2, jadwal).key, "subuh");
eq("next malam besok", nextSholat(t2, jadwal).time.getDate(), 4);

// iqomahState: Kamis 11:55 (3 menit setelah dzuhur, adzan 5mnt + window iqomah 10 mnt) -> aktif
const t3 = new Date(2026, 8, 3, 11, 55, 0);
const s3 = iqomahState(t3, jadwal, iq, 5);
eq("iqomah aktif key", s3 && s3.key, "dzuhur");
eq("iqomah total detik", s3 && s3.totalDetik, 10*60); // fase iqomah = 10 menit penuh
// start = jam azan ASLI dari jadwal (bukan `now`) - mulaiIqomah() di app.js
// pakai ini buat hitung adzanEndTime/iqomahEndTime supaya tetap anchor ke
// jam azan sebenarnya walau mulaiIqomah() kepanggil telat (mis. ganti
// setting durasi adzan pas lagi iqomah, lihat catatan di mulaiIqomah()).
eq("iqomah start = jam azan asli", s3 && s3.start.getTime(), parseHM(jadwal.dzuhur, t3).getTime());
// Kamis 12:10 (18 menit setelah dzuhur, adzan5+iqomah10=15mnt) -> lewat window -> null
eq("iqomah lewat", iqomahState(new Date(2026,8,3,12,10,0), jadwal, iq, 5), null);
// Kamis 10:00 -> bukan waktu sholat -> null
eq("iqomah bukan waktu", iqomahState(t1, jadwal, iq, 5), null);
// Jumat 11:55 dzuhur -> dilewati -> null
eq("iqomah jumat dzuhur null", iqomahState(new Date(2026,8,4,11,55,0), jadwal, iq, 5), null);
// iqomah nonaktif -> adzan tetap wajib tampil (window cuma sepanjang adzan, fase iqomah 0 detik)
const iqOff = JSON.parse(JSON.stringify(iq)); iqOff.dzuhur.aktif=false;
const sOff = iqomahState(t3, jadwal, iqOff, 5);
eq("iqomah nonaktif tetap adzan", sOff && sOff.key, "dzuhur");
eq("iqomah nonaktif totalDetik 0", sOff && sOff.totalDetik, 0);
// iqomah nonaktif & sudah lewat durasi adzan (3mnt bukan didalam 5mnt adzan, ini di dalam) -> cek di luar window adzan -> null
eq("iqomah nonaktif lewat adzan null", iqomahState(new Date(2026,8,3,11,58,0), jadwal, iqOff, 5), null);
// menit 0 tapi aktif=true -> sama seperti nonaktif, adzan tetap tampil
const iqZero = JSON.parse(JSON.stringify(iq)); iqZero.dzuhur.menit=0;
const sZero = iqomahState(t3, jadwal, iqZero, 5);
eq("iqomah menit0 tetap adzan", sZero && sZero.key, "dzuhur");
// adzan 0 menit & iqomah nonaktif -> benar-benar tidak ada apa-apa
eq("iqomah & adzan nonaktif -> null", iqomahState(t3, jadwal, iqOff, 0), null);

// heningState: dzuhur adzan5+iqomah10 -> iqomahEnd 12:07, hening 10 menit -> window [12:07, 12:17)
const hening = { subuh:{menit:10,aktif:true}, dzuhur:{menit:10,aktif:true}, ashar:{menit:10,aktif:true}, maghrib:{menit:10,aktif:true}, isya:{menit:10,aktif:true} };
eq("hening belum masuk (masih iqomah)", heningState(t3, jadwal, iq, hening, 5), null);
const h1 = heningState(new Date(2026,8,3,12,10,0), jadwal, iq, hening, 5);
eq("hening aktif key", h1 && h1.key, "dzuhur");
eq("hening lewat window", heningState(new Date(2026,8,3,12,20,0), jadwal, iq, hening, 5), null);
const heningOff = JSON.parse(JSON.stringify(hening)); heningOff.dzuhur.aktif = false;
eq("hening nonaktif -> null", heningState(new Date(2026,8,3,12,10,0), jadwal, iq, heningOff, 5), null);
eq("hening jumat dzuhur null", heningState(new Date(2026,8,4,12,10,0), jadwal, iq, hening, 5), null);

// harusResumeIqomah: dipakai supaya refresh di tengah adzan/iqomah tidak
// reset hitung mundur ke awal (bug: state lama kehapus balik ke sholat lagi).
const t0 = Date.parse("2026-09-03T11:55:00");
const iqomahEndTime = new Date(t0 + 5 * 60000).toISOString();
eq("resume: key sama & belum lewat", harusResumeIqomah({ key: "dzuhur", iqomahEndTime }, "dzuhur", t0), true);
eq("resume: key beda -> false", harusResumeIqomah({ key: "ashar", iqomahEndTime }, "dzuhur", t0), false);
eq("resume: sudah lewat -> false", harusResumeIqomah({ key: "dzuhur", iqomahEndTime }, "dzuhur", t0 + 10 * 60000), false);
eq("resume: tidak ada state lama -> false", harusResumeIqomah(null, "dzuhur", t0), false);

out.unshift(`${pass} PASS, ${fail} FAIL\n`);
document.getElementById("out").textContent = out.join("\n");
console.log(out.join("\n"));
</script>

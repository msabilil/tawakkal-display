<!doctype html>
<meta charset="utf-8">
<title>Test jadwal-terkoreksi.js</title>
<pre id="out"></pre>
<script type="module">
import { jadwalTerkoreksi } from "./jadwal-terkoreksi.js";
import { saveKoreksiWaktu } from "./settings.js";

const out = [];
let pass = 0, fail = 0;
const tanpaCloud = async () => ({ ok: true, active: false });
function eq(name, got, want) {
  const g = JSON.stringify(got), w = JSON.stringify(want);
  if (g === w) { pass++; out.push(`PASS ${name}`); }
  else { fail++; out.push(`FAIL ${name}\n  got:  ${g}\n  want: ${w}`); }
}

const mentah = { imsak: "04:20", subuh: "04:30", terbit: "05:45", dzuhur: "12:00", ashar: "15:00", maghrib: "18:00", isya: "19:00" };
await saveKoreksiWaktu({ subuh: 5, dzuhur: -10, ashar: 2, maghrib: -3, isya: 1 }, tanpaCloud);
eq("helper memakai koreksi tersimpan", jadwalTerkoreksi(mentah), {
  imsak: "04:20", subuh: "04:35", terbit: "05:45", dzuhur: "11:50",
  ashar: "15:02", maghrib: "17:57", isya: "19:01",
});
eq("helper tidak memutasi cache mentah", mentah.dzuhur, "12:00");
await saveKoreksiWaktu({}, tanpaCloud);

out.unshift(`${pass} PASS, ${fail} FAIL\n`);
document.getElementById("out").textContent = out.join("\n");
console.log(out.join("\n"));
</script>

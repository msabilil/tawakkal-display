<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jadwal Sholat</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="layar">
  <header class="topbar">
    <span id="nama-masjid" class="topbar-nama"></span>
    <a id="tombol-admin" href="admin.html" aria-label="Pengaturan iqomah">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20" aria-hidden="true">
        <line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2"/>
        <line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2"/>
        <line x1="4" y1="18" x2="20" y2="18"/><circle cx="11" cy="18" r="2"/>
      </svg>
    </a>
  </header>

  <main class="konten">
    <section class="ringkasan">
      <div class="ringkasan-kiri">
        <p class="menuju">Menuju <span id="next-nama">-</span></p>
        <div id="jam" class="jam-besar">--:--:--</div>
        <p id="countdown-waktu" class="countdown-kecil">--:--:--</p>
      </div>
      <div class="ringkasan-kanan">
        <p id="tanggal-hijriah" class="tanggal-hijriah"></p>
        <p id="tanggal-masehi" class="tanggal-masehi"></p>
      </div>
    </section>

    <section id="grid-sholat" class="grid-sholat"></section>
  </main>

  <div id="testing-indikator" hidden>Mode pengujian aktif, jadwal di-override lewat halaman admin</div>
  <div id="offline-indikator" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>

<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jadwal Sholat</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="layar">
  <div class="ambient-glow ambient-glow-1"></div>
  <div class="ambient-glow ambient-glow-2"></div>

  <header class="topbar glass-panel">
    <div class="topbar-identitas">
      <div class="topbar-dome">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 2v2"/><path d="M12 8a7 7 0 0 0-7 7v5h14v-5a7 7 0 0 0-7-7z"/>
          <path d="M9 20v-3a3 3 0 0 1 6 0v3"/><circle cx="12" cy="4" r="1"/>
        </svg>
      </div>
      <div>
        <h1 id="nama-masjid" class="topbar-nama"></h1>
        <p id="tagline" class="topbar-tagline"></p>
      </div>
    </div>
    <div class="topbar-aksi">
      <button id="tombol-fullscreen" type="button" aria-label="Layar penuh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 8v-2a2 2 0 0 1 2 -2h2" /><path d="M4 16v2a2 2 0 0 0 2 2h2" />
          <path d="M16 4h2a2 2 0 0 1 2 2v2" /><path d="M16 20h2a2 2 0 0 0 2 -2v-2" />
        </svg>
      </button>
      <a id="tombol-admin" href="admin.html" aria-label="Pengaturan iqomah">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2"/>
          <line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2"/>
          <line x1="4" y1="18" x2="20" y2="18"/><circle cx="11" cy="18" r="2"/>
        </svg>
      </a>
    </div>
  </header>

  <main class="konten">
    <section class="hero">
      <div class="hero-kiri">
        <div class="pill-menuju">
          <span class="pill-titik"></span>
          <span>Menuju <span id="next-nama">-</span></span>
        </div>
        <div id="jam" class="jam-besar">--:--:--</div>
        <div class="pill-countdown">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <span id="countdown-waktu">--:--:--</span>
        </div>
      </div>

      <div class="hero-kanan glass-panel">
        <div class="hero-kanan-baris">
          <span class="chip-ikon chip-ikon-emas">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25zm0 18a8.25 8.25 0 110-16.5 8.25 8.25 0 010 16.5zm.75-12.75h-1.5v6.25l4.5 2.67.75-1.23-3.75-2.22V7.5z"/></svg>
          </span>
          <div>
            <p class="label-kecil">Kalender Hijriyah</p>
            <p id="tanggal-hijriah" class="tanggal-hijriah"></p>
          </div>
        </div>
        <div class="hero-garis"></div>
        <div class="hero-kanan-baris hero-kanan-baris-bawah">
          <div>
            <p class="label-kecil">Kalender Masehi</p>
            <p id="tanggal-masehi" class="tanggal-masehi"></p>
          </div>
          <span class="chip-zona">WIB</span>
        </div>
      </div>
    </section>

    <section id="grid-sholat" class="grid-sholat"></section>
  </main>

  <footer class="footer">
    <div class="marquee-bar glass-panel">
      <span class="marquee-label">Maklumat</span>
      <div class="marquee-viewport">
        <div id="marquee-track" class="marquee-track"></div>
      </div>
    </div>
    <div class="status-bar">
      <div id="testing-indikator" class="pill-status pill-status-hijau" hidden>Mode pengujian aktif</div>
      <div id="offline-indikator" class="pill-status pill-status-warn" hidden></div>
    </div>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
